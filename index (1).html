<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumie 越南代購｜連線選品與訂單追蹤</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PapaParse: 用於解析 Google 試算表 CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF8F5',
              100: '#F4EFEA',
              200: '#E6DDD5',
              500: '#8C7A6B',
              600: '#756456',
              800: '#423830',
              900: '#26201B'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Noto Sans TC"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FAF8F5] text-stone-800 antialiased min-h-screen flex flex-col selection:bg-stone-200">

  <!-- 頂部公告列 -->
  <div class="bg-stone-900 text-stone-200 text-xs py-2 px-4 text-center tracking-widest font-light flex items-center justify-center gap-2">
    <span>🇻🇳 RUMIE VIETNAM SELECT</span>
  </div>

  <!-- 導覽列 Navigation -->
  <header class="sticky top-0 z-40 bg-[#FAF8F5]/90 backdrop-blur-md border-b border-stone-200/80 transition-all">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <!-- 品牌 Logo -->
      <a href="#" class="flex flex-col">
        <span class="text-2xl font-serif tracking-wider font-semibold text-stone-900">Rumie</span>
        <span class="text-[9px] tracking-[0.2em] text-stone-500 uppercase -mt-1">Vietnam Select</span>
      </a>

      <!-- 頁籤與社群按鈕 -->
      <div class="flex items-center gap-2 sm:gap-3">
        <nav class="flex items-center bg-stone-200/60 p-1 rounded-full text-xs font-medium text-stone-600">
          <button id="tab-shop-btn" onclick="switchTab('shop')" class="px-3.5 py-1.5 rounded-full transition-all bg-white text-stone-900 shadow-sm">
            選品型錄
          </button>
          <button id="tab-track-btn" onclick="switchTab('track')" class="px-3.5 py-1.5 rounded-full transition-all hover:text-stone-900">
            訂單進度
          </button>
        </nav>

        <!-- 社群快速入口 (LINE, IG, Threads) -->
        <div class="hidden sm:flex items-center gap-2 border-l border-stone-300 pl-3">
          <a href="https://lin.ee/pbP9jv1i" target="_blank" rel="noopener noreferrer" 
             class="flex items-center gap-1.5 text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1.5 rounded-full transition hover:bg-emerald-100">
            <i data-lucide="message-circle" class="w-3.5 h-3.5 text-emerald-600"></i>
            <span class="font-medium">官方 LINE</span>
          </a>
          <a href="https://www.instagram.com/rumie.select.vt?xtok=N3V5YmFzcno2OW42&utm_source=qr" target="_blank" rel="noopener noreferrer" 
             class="flex items-center gap-1.5 text-xs text-stone-600 hover:text-stone-900 bg-white/80 border border-stone-200 px-2.5 py-1.5 rounded-full transition hover:border-stone-400">
            <i data-lucide="instagram" class="w-3.5 h-3.5 text-stone-700"></i>
            <span>IG</span>
          </a>
          <a href="https://www.threads.com/@rumie.select.vt?igshid=NTc4MTIwNjQ2YQ==" target="_blank" rel="noopener noreferrer" 
             class="flex items-center gap-1.5 text-xs text-stone-600 hover:text-stone-900 bg-white/80 border border-stone-200 px-2.5 py-1.5 rounded-full transition hover:border-stone-400">
            <svg class="w-3.5 h-3.5 fill-current text-stone-700" viewBox="0 0 192 192">
              <path d="M141.537 88.9883C140.71 88.5919 139.87 88.2104 139.019 87.8451C137.537 60.5382 122.616 44.905 97.5619 44.745C97.4484 44.7443 97.3355 44.7443 97.222 44.7443C82.2364 44.7443 69.7731 51.1409 62.102 62.7807L75.881 72.2328C81.6145 63.5383 90.6409 61.1685 97.1627 61.1685C110.1 61.1685 119.537 69.3496 121.282 82.2037C114.167 80.4905 106.31 79.7997 97.7777 80.148C74.6198 81.0858 59.9575 92.4842 61.0829 108.647C62.0673 122.795 73.8409 131.787 88.7501 131.787C105.748 131.787 117.842 121.841 123.003 108.43C127.355 116.349 133.916 121.731 143.084 121.731C154.673 121.731 163.504 113.626 163.504 99.3093C163.504 63.266 135.083 31.5 97.222 31.5C59.9575 31.5 28.5 61.4727 28.5 100.082C28.5 138.835 59.9575 168.808 97.222 168.808C117.067 168.808 134.619 160.672 146.425 146.852L133.684 135.498C124.639 146.126 111.954 152.384 97.222 152.384C69.0437 152.384 45.4124 128.847 45.4124 100.082C45.4124 71.4608 69.0437 47.9242 97.222 47.9242C126.837 47.9242 147.08 72.822 147.08 99.3093C147.08 105.158 143.725 108.204 139.778 108.204C134.82 108.204 130.655 103.528 127.702 96.0689C133.308 93.1818 137.986 90.761 141.537 88.9883ZM98.3905 115.363C88.0264 115.363 80.0801 109.919 79.5293 102.008C78.9619 93.8587 86.6433 87.7289 98.4069 87.2536C105.41 86.9712 112.001 87.7077 118.067 89.4449C115.658 105.777 107.568 115.363 98.3905 115.363Z"/>
            </svg>
            <span>Threads</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    
    <!-- 頁籤 1：選品型錄 (Shop Tab) -->
    <section id="view-shop" class="space-y-8">
      
      <!-- 品牌精神橫幅 -->
      <div class="relative bg-white border border-stone-200/80 rounded-2xl p-6 sm:p-8 overflow-hidden shadow-sm">
        <div class="max-w-xl relative z-10 space-y-3">
          <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-stone-100 text-stone-600 text-xs">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            本期越南連線即時更新中
          </div>
          
          <p class="text-sm text-stone-600 leading-relaxed">
            全館選品皆為越南門市採購正品。於本頁選好規格後，點擊即可組裝規格訊息並至官方 LINE 匯款下單，後續包裹一律經由 7-11 賣貨便寄出。
          </p>
          <div class="pt-2 flex flex-wrap items-center gap-2">
            <a href="https://lin.ee/pbP9jv1i" target="_blank" 
               class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-800 bg-emerald-100/70 hover:bg-emerald-200/70 px-3 py-1.5 rounded-lg transition">
              <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> 加入官方 LINE 詢問
            </a>
            <a href="https://www.instagram.com/rumie.select.vt?xtok=N3V5YmFzcno2OW42&utm_source=qr" target="_blank" 
               class="inline-flex items-center gap-1.5 text-xs font-medium text-stone-700 bg-stone-100 hover:bg-stone-200 px-3 py-1.5 rounded-lg transition">
              <i data-lucide="instagram" class="w-3.5 h-3.5"></i> Instagram 連線實況
            </a>
            <a href="https://www.threads.com/@rumie.select.vt?igshid=NTc4MTIwNjQ2YQ==" target="_blank" 
               class="inline-flex items-center gap-1.5 text-xs font-medium text-stone-700 bg-stone-100 hover:bg-stone-200 px-3 py-1.5 rounded-lg transition">
              <span class="font-bold">@</span> Threads 花絮
            </a>
          </div>
        </div>
      </div>

      <!-- 分類篩選與商品數量 -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-stone-200/80 pb-4">
        <!-- 分類標籤 -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
          <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium transition bg-stone-900 text-white" data-cat="all">全部選品</button>
          <button onclick="filterCategory('tops')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium transition bg-white text-stone-600 border border-stone-200 hover:border-stone-400" data-cat="tops">上衣襯衫</button>
          <button onclick="filterCategory('bottoms')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium transition bg-white text-stone-600 border border-stone-200 hover:border-stone-400" data-cat="bottoms">洋裝下著</button>
          <button onclick="filterCategory('outerwear')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium transition bg-white text-stone-600 border border-stone-200 hover:border-stone-400" data-cat="outerwear">外套外搭</button>
          <button onclick="filterCategory('accessories')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium transition bg-white text-stone-600 border border-stone-200 hover:border-stone-400" data-cat="accessories">包款配件</button>
        </div>
        <div class="text-xs text-stone-500 font-light text-right" id="product-count">
          載入中...
        </div>
      </div>

      <!-- 商品網格清單 -->
      <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
        <!-- JS 動態渲染或空狀態呈現 -->
      </div>
    </section>

    <!-- 頁籤 2：訂單進度追蹤 (Tracking Tab) -->
    <section id="view-track" class="max-w-2xl mx-auto space-y-6 hidden">
      <div class="text-center space-y-2 mb-8">
        <h2 class="text-2xl font-serif font-bold text-stone-900">連線包裹進度查詢</h2>
        <p class="text-xs sm:text-sm text-stone-500">輸入下單時填寫之「手機號碼」或「訂單編號（如 RM-901）」即時查詢
